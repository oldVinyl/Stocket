project_id = "stocket"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
[db]
port = 54322
major_version = 17
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "stocket://auth/callback"]
[auth.email]
enable_signup = true
enable_confirmations = true

# AI requests carry a signed-in user JWT and are also checked inside the handler.
[functions.suggest-category]
verify_jwt = true
# This handler authenticates a dedicated scheduler secret, not a user JWT.
[functions.low-stock-alerts]
verify_jwt = false
